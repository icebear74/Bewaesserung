[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    olikraus/U8g2@^2.35.7
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.0.0
    arduino-libraries/NTPClient@^3.2.1
monitor_speed = 115200
board_build.filesystem = littlefs
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
